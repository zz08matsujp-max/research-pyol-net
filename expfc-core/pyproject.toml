[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expfc-core"
version = "0.1.0"
description = "External Prefrontal Cortex — Core Specification and Reference Implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code) + CC BY 4.0 (spec)" }
authors = [
    { name = "Toshinobu Matsuura", email = "matsuura@pyol.net" }
]
keywords = [
    "scam-detection",
    "affective-computing",
    "ai-safety",
    "neuroethics",
    "buddhism",
    "bonno",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://research.pyol.net"
Repository = "https://github.com/mindseed-research/expfc-core"
Documentation = "https://research.pyol.net/concept/bonno-virus-mapping/#17"
Issues = "https://github.com/mindseed-research/expfc-core/issues"

[tool.setuptools.packages.find]
include = ["expfc_core*"]

[tool.setuptools.package-data]
"expfc_core" = ["*.yaml", "*.json"]
